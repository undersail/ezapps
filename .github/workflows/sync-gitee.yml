name: Sync to Gitee Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Gitee mirror
        run: |
          git push https://oauth2:${{ secrets.GITEE_DEPLOY_KEY }}@gitee.com/undersail/ezapps.git --all --force